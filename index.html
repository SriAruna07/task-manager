<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginPage" class="login-page">

    <div class="login-box">

        <h2>Welcome Back</h2>
        <p>Login to manage your tasks</p>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button id="loginBtn">Login</button>

        <p class="register-text">
            Don't have an account?
            <a href="#" id="showRegister">Register</a>
        </p>

    </div>

</div>

<div id="registerPage" class="login-page" style="display: none;">

    <div class="login-box">

        <h2>Create Account</h2>
        <p>Register to manage your tasks</p>

        <input
            type="text"
            id="registerName"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
        >

        <button id="registerBtn">Register</button>

        <p class="register-text">
            Already have an account?
            <a href="#" id="showLogin">Login</a>
        </p>

    </div>

</div>

    <div class="container">
        <button id="logoutBtn" class="logout-btn">Logout</button>

        <h1>Task Manager</h1>
        <p class="subtitle">Organize your tasks and stay productive.</p>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <input type="text" id="subjectInput" placeholder="Subject">
            <input type="date" id="dateInput">

            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="task-stats">
            <div>
                <span id="totalTasks">0</span>
                <p>Total</p>
            </div>

            <div>
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>

            <div>
                <span id="pendingTasks">0</span>
                <p>Pending</p>
            </div>
        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
